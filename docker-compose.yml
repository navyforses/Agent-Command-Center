# Trial Navigator - Docker Compose Configuration
# Usage: docker-compose up -d

version: '3.8'

services:
  # ================================
  # Backend API (FastAPI)
  # ================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trial-navigator-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trial-navigator-network
    depends_on:
      - redis

  # ================================
  # Frontend (React/Vite)
  # ================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trial-navigator-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_STRIPE_PUBLIC_KEY=${VITE_STRIPE_PUBLIC_KEY}
    networks:
      - trial-navigator-network
    depends_on:
      - backend

  # ================================
  # Redis (Cache & Queue)
  # ================================
  redis:
    image: redis:7-alpine
    container_name: trial-navigator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - trial-navigator-network

  # ================================
  # Nginx (Reverse Proxy) - Production
  # ================================
  nginx:
    image: nginx:alpine
    container_name: trial-navigator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - trial-navigator-network
    depends_on:
      - backend
      - frontend
    profiles:
      - production

networks:
  trial-navigator-network:
    driver: bridge

volumes:
  redis-data:
